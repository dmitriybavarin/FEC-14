Name: FEC14
Order: -2
Entries:
- author: Bavarin
  changes:
  - message: Полный русский перевод интерфейса, ролей, ксеноморфов и предметов.
    type: Add
  - message: Новое название, логотип и иконка окна Frontier Expeditionary Corps 14.
    type: Tweak
  id: 1
  time: '2026-10-03T12:00:00.0000000+00:00'
- author: Bavarin
  changes:
  - message: При осмотре эксклюзивные предметы FEC14 теперь отмечаются жетоном "Эксклюзив FEC14".
    type: Add
  - message: Флаг кнопки языка теперь сразу показывает текущий язык после появления в раунде.
    type: Fix
  - message: Исправлено подключение через лаунчер к локальному серверу.
    type: Fix
  id: 2
  time: '2026-10-04T12:00:00.0000000+00:00'
- author: Bavarin
  changes:
  - message: Изменения FEC14 вынесены в отдельную вкладку, вкладка RMC14 вернула свое название.
    type: Tweak
  id: 3
  time: '2026-10-04T13:00:00.0000000+00:00'
- author: Bavarin
  changes:
  - message: Поддержка широких экранов. Поле зрения растягивается под соотношение сторон окна, черных полос по бокам больше нет.
    type: Add
  - message: Окно предложения из очереди личинок больше не закрывается клавишей Esc.
    type: Fix
  - message: Призраки продолжают следить за ксеноморфом после его эволюции.
    type: Fix
  - message: Погода на колониях. Дождь, гроза, тропический шторм, метель, пыльные и песчаные бури, предупреждения морпехам и ксеноморфам, сирены.
    type: Add
  - message: Админам добавлено окно управления погодой во вкладке Admin abuse.
    type: Add
  - message: Осадки идут только под открытым небом, на уровне перекрытия 0.
    type: Tweak
  - message: Если доступна одна раса, строка выбора расы в редакторе персонажа скрыта.
    type: Tweak
  - message: В списке игроков у админов вместо "На стороне экипажа" показывается сторона игрока, например морпехи или ксеноморфы.
    type: Tweak
  - message: Закрыта возможность для игроков отправлять серверу картинки фигурок в сборках для разработки.
    type: Fix
  - message: Окна создания сущностей, тайлов и декалей теперь закрываются повторным нажатием F5, F6 и F8.
    type: Fix
  - message: Кнопки панели песочницы работают у админов. Кнопка возрождения переименована в "В лобби".
    type: Fix
  - message: Флаг текущего языка на кнопке меню языков больше не пропадает.
    type: Fix
  - message: Окно справки игры везде называется "Руководство". У термоядерного реактора S-52 появилось описание.
    type: Tweak
  - message: Длинные названия предметов в руке сокращаются многоточием, полное название видно при наведении.
    type: Tweak
  - message: Кнопка "В лобби" в панели песочницы отправляет в лобби даже без включенного лобби.
    type: Fix
  - message: Предметы, требующие навыка, теперь можно бросить, чтобы передать. Без навыка брошенный предмет никого не оглушает.
    type: Tweak
  - message: SPP переименован в СССП, отделения морпехов в отряды. Вернулись пропавшие переводы доступов, ролей антагонистов и категорий карго.
    type: Tweak
  - message: Доступы фракций названы единообразно, например "СССП - Общий", "Колония - Медотсек", "Ве-Я - Летный".
    type: Tweak
  - message: Вес админ-рангов. Админ с меньшим весом не может банить, наказывать и редактировать админа с большим весом. Вес виден в панели прав, менять его можно с флагом ADMINWEIGHT.
    type: Add
  - message: Отдельное право WEATHER для окна управления погодой.
    type: Add
  - message: В админском конфигураторе доступа появились доступы СССП, TSEPA, Ве-Я, отрядов Эхо и Фокстрот и другие. Для ивентов добавлены шлюзы под каждый доступ СССП, инспектора TSEPA и летный доступ Ве-Я.
    type: Add
  - message: Окно тактической карты называется "Тактическая карта".
    type: Tweak
  id: 4
  time: '2026-10-09T12:00:00.0000000+00:00'
