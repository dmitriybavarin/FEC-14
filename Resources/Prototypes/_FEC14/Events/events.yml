- type: antag
  id: FECEventCMBMarshal
  name: fec-event-antag-marshal-name
  objective: fec-event-antag-marshal-objective
  antagonist: false
  setPreference: true
  isCM: true

- type: entity
  id: FECFactionPunitive
  categories: [ HideSpawnMenu ]
  components:
  - type: IFFFaction

- type: entity
  parent: BaseGameRule
  id: FECMarshalRescueRule
  components:
  - type: FECMarshalRescueRule

- type: entity
  parent: BaseGameRule
  id: FECCMBPatrolRule
  components:
  - type: FECTeamDropRule
    spawners:
    - RMCRandomHumanoidBureauMarshal
    - RMCRandomHumanoidBureauDeputy
    - RMCRandomHumanoidBureauDeputy
    aresAnnouncement: fec-patrol-ares
    summary: fec-patrol-summary

- type: entity
  parent: BaseGameRule
  id: FECAnomalousStormRule
  components:
  - type: FECWeatherStormRule

- type: fecEvent
  id: MarshalRescue
  name: fec-event-marshal-name
  description: fec-event-marshal-desc
  rule: FECMarshalRescueRule
  minPlayers: 60
  weight: 1
  earliestStart: 900
  latestStart: 2400
  chains:
  - outcome: saved
    event: CMBPatrol
    delay: 600

- type: fecEvent
  id: CMBPatrol
  name: fec-event-patrol-name
  description: fec-event-patrol-desc
  rule: FECCMBPatrolRule
  minPlayers: 30
  weight: 2
  earliestStart: 1800
  latestStart: 4200

- type: fecEvent
  id: AnomalousStorm
  name: fec-event-storm-name
  description: fec-event-storm-desc
  rule: FECAnomalousStormRule
  minPlayers: 0
  weight: 2
  earliestStart: 2400
  latestStart: 5400

- type: entity
  parent: BaseGameRule
  id: FECPizzaDeliveryRule
  components:
  - type: FECTeamDropRule
    location: Ship
    spawners:
    - RMCRandomHumanoidPizzaDeliveryBoy
    aresAnnouncement: fec-pizza-ares
    summary: fec-pizza-summary
    outcome: landed

- type: entity
  parent: BaseGameRule
  id: FECFreelancersRule
  components:
  - type: FECTeamDropRule
    location: Planet
    scatter: 2.5
    spawners:
    - RMCRandomHumanoidFreelancerLeaderHostile
    - RMCRandomHumanoidFreelancerMedicHostile
    - RMCRandomHumanoidFreelancerStandardHostile
    - RMCRandomHumanoidFreelancerStandardHostile
    - RMCRandomHumanoidFreelancerStandardHostile
    aresAnnouncement: fec-freelancers-ares
    xenoAnnouncement: fec-freelancers-xeno
    summary: fec-freelancers-summary
    outcome: landed

- type: fecEvent
  id: PizzaDelivery
  name: fec-event-pizza-name
  description: fec-event-pizza-desc
  rule: FECPizzaDeliveryRule
  minPlayers: 20
  weight: 1
  earliestStart: 1200
  latestStart: 5400
  requiresPlanet: false

- type: fecEvent
  id: Freelancers
  name: fec-event-freelancers-name
  description: fec-event-freelancers-desc
  rule: FECFreelancersRule
  minPlayers: 50
  weight: 1
  earliestStart: 2400
  latestStart: 5400
