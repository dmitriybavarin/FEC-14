- type: radioChannel
  id: FECMarsoc
  name: chat-radio-fec-marsoc
  keycode: "0"
  frequency: 1725
  color: "#c0392b"
  longRange: true
  tower: true

- type: entity
  parent: SquadSOF
  id: FECSquadMarsoc
  name: MARSOC
  components:
  - type: SquadTeam
    color: "#400000"
    background:
      sprite: _RMC14/Interface/job_icons/Misc/other.rsi
      state: empty
    radio: FECMarsoc
    accessLevels: []
    minimapBackground:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: background_sof
    group: SOF
    leaderIcon:
      sprite: _RMC14/Interface/job_icons/UNMC/marsoc.rsi
      state: hudsquad_soctl

- type: entity
  parent: RMCHeadsetMARSOC
  id: FECHeadsetMarsoc
  name: MARSOC headset
  description: An encrypted headset of the High Command personal unit. Picks up every USCM and colony channel.
  suffix: FEC
  components:
  - type: RMCHeadset
    channels:
    - FECMarsoc
    - MarineSOF
    - MarineHighCommand
    - MarineCommon
    - MarineCommand
    - MarineMedical
    - MarineEngineer
    - MarineMilitaryPolice
    - MarineRequisition
    - MarineIntel
    - MarineJTAC
    - MarineAlpha
    - MarineBravo
    - MarineCharlie
    - MarineDelta
    - MarineEcho
    - MarineFoxtrot
    - Colony
    - CMB
    - WEYA
    - Provost
    radioTextIncrease: 1
  - type: EncryptionKeyHolder
    defaultChannel: FECMarsoc

- type: entity
  parent: FECHeadsetMarsoc
  id: FECHeadsetMarsocCommand
  name: MARSOC command headset
  suffix: FEC, Command
  components:
  - type: RMCHeadset
    channels:
    - FECMarsoc
    - MarineSOF
    - MarineHighCommand
    - MarineCommon
    - MarineCommand
    - MarineMedical
    - MarineEngineer
    - MarineMilitaryPolice
    - MarineRequisition
    - MarineIntel
    - MarineJTAC
    - MarineAlpha
    - MarineBravo
    - MarineCharlie
    - MarineDelta
    - MarineEcho
    - MarineFoxtrot
    - Colony
    - CMB
    - WEYA
    - Provost
    radioTextIncrease: 3

